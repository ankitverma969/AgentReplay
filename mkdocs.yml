site_name: AgentReplay
site_description: Framework-agnostic debugging, replay, and observability for AI agents.
site_url: https://ankitverma969.github.io/AgentReplay/
repo_url: https://github.com/ankitverma969/AgentReplay
repo_name: ankitverma969/AgentReplay
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - Tutorials: tutorials.md
      - Cookbook: cookbook.md
      - Examples: examples.md
      - FAQ: faq.md
      - Troubleshooting: TROUBLESHOOTING.md
      - Best Practices: BEST_PRACTICES.md
  - Architecture:
      - Overview: architecture.md
      - System Design: SYSTEM_DESIGN.md
      - Storage: STORAGE_GUIDE.md
      - Development: development.md
  - Guides:
      - OpenAI Agents SDK: openai_agents.md
      - LangGraph: langgraph.md
      - Debugger: DEBUGGER_GUIDE.md
      - Profiler: PROFILER_GUIDE.md
      - Reporting: REPORTING_GUIDE.md
      - Regression: REGRESSION_GUIDE.md
      - Performance: PERFORMANCE_GUIDE.md
      - Security: SECURITY_GUIDE.md
      - Observability: OBSERVABILITY_GUIDE.md
      - Configuration: CONFIGURATION_GUIDE.md
      - SDK: SDK_GUIDE.md
      - Plugins: PLUGIN_GUIDE.md
  - Reference:
      - API Reference: api_reference.md
      - CLI Reference: CLI_REFERENCE.md
      - Migration Guide: migration.md
      - Release Engineering: release_engineering.md
  - Module Deep Dives:
      - Debugger Notes: debugger.md
      - Profiler Notes: profiler.md
      - Reporting Notes: reporting.md
      - Regression Notes: regression.md
      - Performance Notes: performance.md
      - Security Notes: security.md
      - Observability Notes: observability.md
      - SDK Notes: sdk.md
      - Plugin Notes: plugins.md
