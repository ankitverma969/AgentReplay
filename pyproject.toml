[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreplay"
version = "0.1.0"
description = "Framework-agnostic debugging and replay foundation for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AgentReplay Maintainers" }]
keywords = ["ai", "agents", "debugging", "replay", "observability"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.1",
]
openai-agents = ["openai-agents"]
langgraph = ["langgraph"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
]
all = [
  "openai-agents",
  "langgraph",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
]

[project.scripts]
agentreplay = "agentreplay.cli.main:main"

[project.urls]
Homepage = "https://github.com/ankitverma969/AgentReplay"
Repository = "https://github.com/ankitverma969/AgentReplay"
Issues = "https://github.com/ankitverma969/AgentReplay/issues"

[tool.setuptools.packages.find]
include = ["agentreplay*"]

[tool.setuptools.package-data]
agentreplay = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["agentreplay", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "FA",
  "I",
  "N",
  "PT",
  "PTH",
  "RET",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"agentreplay/logging.py" = ["A005"]
"agentreplay/types.py" = ["A005"]
"tests/**/*.py" = ["D100", "D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
files = ["agentreplay", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
